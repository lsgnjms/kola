# Regtest stack: bitcoind + coordinator LND + 3 member LND nodes + Nostr relay.
# Regtest only; never point this at mainnet.
# Host ports are bound to 127.0.0.1 so nothing is exposed on the network.
name: kola

# Shared LND flags live in the entrypoint; each service's `command` appends its own.
x-lnd: &lnd
  image: lightninglabs/lnd:v0.18.3-beta
  restart: unless-stopped
  depends_on: [bitcoind]
  entrypoint:
  - lnd
  - --noseedbackup
  - --bitcoin.regtest
  - --bitcoin.node=bitcoind
  - --bitcoind.rpchost=bitcoind:18443
  - --bitcoind.rpcuser=${BITCOIND_RPC_USER:-kola}
  - --bitcoind.rpcpass=${BITCOIND_RPC_PASS:-kola-regtest-only}
  - --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
  - --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
  - --rpclisten=0.0.0.0:10009
  - --restlisten=0.0.0.0:8080
  - --listen=0.0.0.0:9735
  - --tlsextradomain=localhost
  - --trickledelay=1000

services:
  bitcoind:
    image: polarlightning/bitcoind:27.0
    restart: unless-stopped
    command:
      - bitcoind
      - -regtest=1
      - -server=1
      - -txindex=1
      - -printtoconsole=1
      - -fallbackfee=0.0002
      - -rpcuser=${BITCOIND_RPC_USER:-kola}
      - -rpcpassword=${BITCOIND_RPC_PASS:-kola-regtest-only}
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -zmqpubrawblock=tcp://0.0.0.0:28334
      - -zmqpubrawtx=tcp://0.0.0.0:28335
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin

  coordinator:
    <<: *lnd
    command: [--alias=coordinator, --tlsextradomain=coordinator]
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["./data/coordinator:/root/.lnd"]

  alice:
    <<: *lnd
    command: [--alias=alice, --tlsextradomain=alice]
    ports: ["127.0.0.1:8082:8080"]
    volumes: ["./data/alice:/root/.lnd"]

  bob:
    <<: *lnd
    command: [--alias=bob, --tlsextradomain=bob]
    ports: ["127.0.0.1:8083:8080"]
    volumes: ["./data/bob:/root/.lnd"]

  carol:
    <<: *lnd
    command: [--alias=carol, --tlsextradomain=carol]
    ports: ["127.0.0.1:8084:8080"]
    volumes: ["./data/carol:/root/.lnd"]

  relay:
    image: scsibug/nostr-rs-relay:0.9.0
    restart: unless-stopped
    ports: ["127.0.0.1:7777:8080"]
    volumes:
      - relay-data:/usr/src/app/db

volumes:
  bitcoind-data:
  relay-data:
